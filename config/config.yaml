# =============================================================================
# kallisto-TE pipeline settings (step 5: docs/06_snakemake.md)
#
# Copy the parts you need into a file next to your data, edit them, and run
# from the repository:
#   snakemake --cores 8 --configfile /path/to/my_project.yaml
# Anything you leave out of your copy keeps the value below.
#
# Relative paths are relative to the folder you run snakemake from.
# =============================================================================

# Where all results go (created if needed):
#   <outdir>/01_trimmed/   bulk reads after fastp (step 2)
#   <outdir>/02_quant/     bulk kallisto results (step 3)
#   <outdir>/03_kb_count/  single-cell count matrices (step 4)
#   <outdir>/logs/         one log per step
outdir: results

# ----------------------------------------------------------------------------
# The genes + TE index (required). The pipeline does not build it: build it
# once per species / genome release with scripts/index/build_index.sh
# (docs/01_build_index.md) and use it for every project. Give the .idx file;
# t2g.txt is looked for next to it unless you set t2g.
# ----------------------------------------------------------------------------
index: ""                   # e.g. /path/to/references/mm10_TE/index/mm10_GencodeM25_RepBase25.05_genes_TE.idx
t2g: ""

# ----------------------------------------------------------------------------
# Steps 2-3: bulk RNA-seq (docs/03_qc_trimming.md, docs/04_bulk_kallisto_quant.md)
# Leave fastq_dir empty to skip. Set bulk and/or single-cell.
# ----------------------------------------------------------------------------
bulk:
  fastq_dir: ""             # folder with the raw FASTQ files
  trim: true                # run fastp first (step 2); false = quantify the raw reads
  single_end: false         # true = every file is its own single-end sample
  fastp_args: ""            # extra fastp options, e.g. "--adapter_sequence AGATCGGAAGAGC"
  strand: auto              # auto | rf | fr | unstranded
  fragment_length: 200      # single-end reads only
  fragment_sd: 20           # single-end reads only
  bootstraps: 30            # 0 is fine if you only use DESeq2

# ----------------------------------------------------------------------------
# Step 4: droplet single-cell RNA-seq (docs/05_singlecell_kb_count.md)
# Raw reads only: single-cell reads are never trimmed. Leave fastq_dir empty
# to skip.
# ----------------------------------------------------------------------------
singlecell:
  fastq_dir: ""             # folder with the raw FASTQ files (R1 + R2 of every lane)
  tech: 10xv3               # 10xv2 | 10xv3 | 10xv4 | ... (kb --list)
  memory: 16G               # memory kb may use for sorting barcodes (4G on a 16 GB computer)
  filter: false             # also write counts_filtered/ (bustools knee filter)
  h5ad: false               # also write an AnnData .h5ad file

# ----------------------------------------------------------------------------
# Threads, memory (MB) and time limit (minutes) per step, used on a cluster
# (--profile profiles/slurm). On one computer only threads matter, capped by
# --cores. Each step is ONE job for all samples, so raise runtime for large
# projects; a run that hits the limit resumes where it stopped.
# Measured with a mouse genes + TE index: kallisto quant and kb count used
# under 2 GB of memory; kb count needs about memory (above) + a few GB.
# ----------------------------------------------------------------------------
resources:
  trim_bulk:   {threads: 8,  mem_mb: 8000,  runtime: 360}
  quant_bulk:  {threads: 8,  mem_mb: 16000, runtime: 1440}
  kb_count:    {threads: 16, mem_mb: 64000, runtime: 1440}
